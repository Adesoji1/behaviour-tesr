# Behaviour-Profile microservice + its PostgreSQL profile store.
#
#   cp .env.example .env      # then fill in secrets
#   docker compose up -d --build
#   docker compose logs -f
#
# Service:  http://localhost:8080   (Swagger /docs, score POST /score)
# Sync:     a SEPARATE background service pulls production on a schedule (the ONLY
#           production reader) — it is NOT triggered by any HTTP request.
# Store:    PostgreSQL 17 on 127.0.0.1:5432 (loopback only — never published wide)
#
# The store lives in a NAMED VOLUME: it survives `docker compose down`.
# It does NOT survive `docker compose down -v` — never use -v here.
# A volume is not a backup: schedule pg_dump (see RUNBOOK).
services:

  # ---------------------------------------------------------------------------
  # LIVE-VELOCITY store (Redis) — short-lived per-customer transaction window used to compute the
  # real-time velocity/recency ML features (see ml/live_velocity.py). It is a STATE STORE, not a
  # fraud engine. Enrichment-only + fail-safe: if this is down, /score keeps working on the cache.
  # Durable across restarts via the redis-data volume (RDB snapshots); TTL-bounded so it self-cleans.
  redis:
    image: redis:7-alpine
    container_name: adhere-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-ttl"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  db:
    image: postgres:17
    container_name: behaviour-profile-db
    # Loopback only: the store is reachable from this host, not the whole network.
    # STORE_PG_HOST_PORT is the port published on YOUR machine (default 5433 so it
    # never clashes with a local postgres on 5432). Inside the compose network the
    # service always talks to db:5432.
    ports:
      - "127.0.0.1:${STORE_PG_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${STORE_PG_DB:-behaviour}
      POSTGRES_USER: ${STORE_PG_USER:-behaviour}
      POSTGRES_PASSWORD: ${STORE_PG_PASSWORD:?STORE_PG_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata17
    restart: unless-stopped
    shm_size: 256mb                     # Postgres wants more than the 64mb default
    volumes:
      - pgdata17:/var/lib/postgresql/data/pgdata17
      # Applied automatically on FIRST init of an empty volume:
      - ./schema_pg.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:                            # bounded logs; ship them off-host in prod
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  behaviour-profile:
    build: .
    image: adhere-behaviour:latest
    container_name: adhere-behaviour
    ports:
      - "8080:8080"
    env_file:
      - .env                            # all secrets + tuning come from here
    environment:
      STORE_PG_HOST: db                 # reach the store over the compose network
      STORE_PG_PORT: 5432
      # /score is served by the behavioural MODEL in-process (CPU). false = legacy rule engine.
      # The embedded model reads the store via BF_PG_* -> falls back to STORE_PG_* (db:5432), so
      # no extra DB config is needed here.
      BP_USE_MODEL: ${BP_USE_MODEL:-true}
      BP_SCORE_WEBHOOK_URL: ${BP_SCORE_WEBHOOK_URL:-}
      # API-key auth for POST /score. Loaded from .env; explicit here so it's visible.
      # Empty -> the DB-managed rotating key (manage_api_key.py) is used instead.
      BP_API_KEY: ${BP_API_KEY:-}
      # Live-velocity store (real-time burst features). Defaults to the compose `redis` service.
      # Set empty to disable (velocity falls back to the batch cache). Fail-safe if Redis is down.
      BP_REDIS_URL: ${BP_REDIS_URL:-redis://redis:6379/0}
    volumes:
      # The database engineer reads the exact JSON every GET /demo returns here.
      # Container writes to /app/logs/demo (config.DEMO_LOG_DIR); host sees ./logs/demo.
      - ./logs:/app/logs
      # The promoted MODEL the trainer produced (loaded at startup for /score). Shared with the
      # trainer service so training and serving use the same artifacts.
      - ./artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy      # never start before the store is ready
      redis:
        condition: service_started      # start Redis first, but DON'T block on it (fail-safe)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # SCHEDULED INGESTION — the ONLY production reader. Runs sync_manager in a loop
  # every BP_SYNC_INTERVAL_SECONDS. Keep this at ONE instance (do NOT scale it) so
  # production always has exactly one reader. It is decoupled from the API: if it
  # stops, scoring keeps working from the last synced cache.
  # In Kubernetes this is a CronJob instead (see README "Scheduled ingestion").
  # ---------------------------------------------------------------------------
  sync:
    build: .
    image: adhere-behaviour:latest
    container_name: adhere-behaviour-sync
    command: ["python", "sync_manager.py", "--loop"]
    env_file:
      - .env
    environment:
      STORE_PG_HOST: db
      STORE_PG_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # This service does NOT serve HTTP, so disable the image's HTTP health check.
    # Liveness = the process: the --loop catches every error and never exits, and
    # `restart: unless-stopped` covers a hard crash. Watch progress in GET /sync/status.
    healthcheck:
      test: ["NONE"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # OFFLINE TRAINER (opt-in, GPU) — builds + promotes the behavioural MODEL, then EXITS.
  # This is the ONLY GPU component; serving needs no GPU. Run it on a schedule (cron / k8s
  # CronJob) or gate it with `python -m ml.retrain_trigger --run`:
  #   docker compose --profile train run --rm trainer --promote
  # It writes the promoted model to the SAME ./artifacts the behaviour-profile service loads.
  # Needs the NVIDIA Container Toolkit; without a GPU it falls back to CPU (slower).
  # ---------------------------------------------------------------------------
  trainer:
    build:
      context: .
      dockerfile: Dockerfile.ml
    image: adhere-bf-ml:latest
    container_name: adhere-bf-trainer
    profiles: ["train"]                    # excluded from normal `up`
    env_file:
      - .env
    environment:
      BF_PG_HOST: db                       # read the store over the compose network
      BF_PG_PORT: 5432
      BF_LOG_FILE: /app/logs/ml.log
      BF_MIN_TXNS: ${BF_MIN_TXNS:-50}
      BF_MIN_DAYS_ACTIVE: ${BF_MIN_DAYS_ACTIVE:-30}
    volumes:
      - ./artifacts:/app/artifacts         # promoted model lands here (shared with serving)
      - ./logs:/app/logs                   # ML-job audit logs (ml.log)
    depends_on:
      db:
        condition: service_healthy
    deploy:                                # request the GPU (NVIDIA Container Toolkit)
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # LOAD TEST (opt-in) — Locust against POST /score. Never starts by default; run it
  # explicitly with the `loadtest` profile:
  #   docker compose --profile loadtest run --rm loadtest
  # All knobs are env-driven (LOCUST_USERS / LOCUST_SPAWN_RATE / LOCUST_RUN_TIME /
  # SCORE_SLA_MS / SCORE_LOAD_ENTITY_KEYS). Results land in ./logs/loadtest/.
  # ---------------------------------------------------------------------------
  loadtest:
    image: locustio/locust:latest
    container_name: adhere-loadtest
    profiles: ["loadtest"]                 # excluded from normal `up`
    depends_on:
      behaviour-profile:
        condition: service_healthy
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py:ro
      - ./logs:/mnt/logs                   # host sees results under ./logs/loadtest/
    environment:
      SCORE_SLA_MS: ${SCORE_SLA_MS:-600}
      SCORE_LOAD_ENTITY_KEYS: ${SCORE_LOAD_ENTITY_KEYS:-}
      SCORE_ABNORMAL_PCT: ${SCORE_ABNORMAL_PCT:-0.10}
      SCORE_WAIT_MIN: ${SCORE_WAIT_MIN:-0.0}
      SCORE_WAIT_MAX: ${SCORE_WAIT_MAX:-0.05}
    command: >
      -f /mnt/locust/locustfile.py
      --host http://behaviour-profile:8080
      --headless
      --users ${LOCUST_USERS:-50}
      --spawn-rate ${LOCUST_SPAWN_RATE:-10}
      --run-time ${LOCUST_RUN_TIME:-60s}
      --csv /mnt/logs/loadtest/score
      --html /mnt/logs/loadtest/score.html
      --logfile /mnt/logs/loadtest/locust.log

volumes:
  pgdata17:                             # named volume — the profile store lives here
    name: behaviour_pgdata17
  redis-data:                           # live-velocity window (durable across Redis restarts)
    name: behaviour_redis_data

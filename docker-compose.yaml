# Behaviour-Profile microservice + its PostgreSQL profile store.
#
#   cp .env.example .env      # then fill in secrets
#   docker compose up -d --build
#   docker compose logs -f
#
# Service:  http://localhost:8080   (docs /docs, demo /demo)
# Sync:     a SEPARATE background service pulls production on a schedule (the ONLY
#           production reader) — it is NOT triggered by any HTTP request.
# Store:    PostgreSQL 17 on 127.0.0.1:5432 (loopback only — never published wide)
#
# The store lives in a NAMED VOLUME: it survives `docker compose down`.
# It does NOT survive `docker compose down -v` — never use -v here.
# A volume is not a backup: schedule pg_dump (see RUNBOOK).
services:
  db:
    image: postgres:17
    container_name: behaviour-profile-db
    # Loopback only: the store is reachable from this host, not the whole network.
    # STORE_PG_HOST_PORT is the port published on YOUR machine (default 5433 so it
    # never clashes with a local postgres on 5432). Inside the compose network the
    # service always talks to db:5432.
    ports:
      - "127.0.0.1:${STORE_PG_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${STORE_PG_DB:-behaviour}
      POSTGRES_USER: ${STORE_PG_USER:-behaviour}
      POSTGRES_PASSWORD: ${STORE_PG_PASSWORD:?STORE_PG_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata17
    restart: unless-stopped
    shm_size: 256mb                     # Postgres wants more than the 64mb default
    volumes:
      - pgdata17:/var/lib/postgresql/data/pgdata17
      # Applied automatically on FIRST init of an empty volume:
      - ./schema_pg.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:                            # bounded logs; ship them off-host in prod
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  behaviour-profile:
    build: .
    image: adhere-behaviour:latest
    container_name: adhere-behaviour
    ports:
      - "8080:8080"
    env_file:
      - .env                            # all secrets + tuning come from here
    environment:
      STORE_PG_HOST: db                 # reach the store over the compose network
      STORE_PG_PORT: 5432
    volumes:
      # The database engineer reads the exact JSON every GET /demo returns here.
      # Container writes to /app/logs/demo (config.DEMO_LOG_DIR); host sees ./logs/demo.
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy      # never start before the store is ready
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # SCHEDULED INGESTION — the ONLY production reader. Runs sync_manager in a loop
  # every BP_SYNC_INTERVAL_SECONDS. Keep this at ONE instance (do NOT scale it) so
  # production always has exactly one reader. It is decoupled from the API: if it
  # stops, scoring keeps working from the last synced cache.
  # In Kubernetes this is a CronJob instead (see README "Scheduled ingestion").
  # ---------------------------------------------------------------------------
  sync:
    build: .
    image: adhere-behaviour:latest
    container_name: adhere-behaviour-sync
    command: ["python", "sync_manager.py", "--loop"]
    env_file:
      - .env
    environment:
      STORE_PG_HOST: db
      STORE_PG_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # This service does NOT serve HTTP, so disable the image's HTTP health check.
    # Liveness = the process: the --loop catches every error and never exits, and
    # `restart: unless-stopped` covers a hard crash. Watch progress in GET /sync/status.
    healthcheck:
      test: ["NONE"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # LOAD TEST (opt-in) — Locust against POST /score. Never starts by default; run it
  # explicitly with the `loadtest` profile:
  #   docker compose --profile loadtest run --rm loadtest
  # All knobs are env-driven (LOCUST_USERS / LOCUST_SPAWN_RATE / LOCUST_RUN_TIME /
  # SCORE_SLA_MS / SCORE_LOAD_ENTITY_KEYS). Results land in ./logs/loadtest/.
  # ---------------------------------------------------------------------------
  loadtest:
    image: locustio/locust:latest
    container_name: adhere-loadtest
    profiles: ["loadtest"]                 # excluded from normal `up`
    depends_on:
      behaviour-profile:
        condition: service_healthy
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py:ro
      - ./logs:/mnt/logs                   # host sees results under ./logs/loadtest/
    environment:
      SCORE_SLA_MS: ${SCORE_SLA_MS:-600}
      SCORE_LOAD_ENTITY_KEYS: ${SCORE_LOAD_ENTITY_KEYS:-}
      SCORE_ABNORMAL_PCT: ${SCORE_ABNORMAL_PCT:-0.10}
      SCORE_WAIT_MIN: ${SCORE_WAIT_MIN:-0.0}
      SCORE_WAIT_MAX: ${SCORE_WAIT_MAX:-0.05}
    command: >
      -f /mnt/locust/locustfile.py
      --host http://behaviour-profile:8080
      --headless
      --users ${LOCUST_USERS:-50}
      --spawn-rate ${LOCUST_SPAWN_RATE:-10}
      --run-time ${LOCUST_RUN_TIME:-60s}
      --csv /mnt/logs/loadtest/score
      --html /mnt/logs/loadtest/score.html
      --logfile /mnt/logs/loadtest/locust.log

volumes:
  pgdata17:                             # named volume — the profile store lives here
    name: behaviour_pgdata17
